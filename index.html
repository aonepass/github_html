<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1f6feb33 100%);
      color: #e6edf3;
    }
    .card {
      text-align: center;
      padding: 48px 56px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      max-width: 560px;
    }
    h1 { font-size: 2rem; margin-bottom: 12px; }
    .badge {
      display: inline-block;
      padding: 4px 14px;
      margin-bottom: 20px;
      border-radius: 999px;
      background: #1f6feb;
      font-size: 0.85rem;
    }
    p { color: #9da7b3; line-height: 1.7; margin-bottom: 8px; }
    #time { color: #3fb950; font-weight: 600; }
    button {
      margin-top: 24px;
      padding: 10px 28px;
      font-size: 1rem;
      color: #fff;
      background: #238636;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    button:hover { transform: scale(1.05); }
    #count { color: #d29922; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">GitHub Pages</div>
    <h1>静态网页部署成功</h1>
    <p>这是一个通过 GitHub Pages 部署的 demo 页面。</p>
    <p>当前时间：<span id="time"></span></p>
    <p>按钮被点击：<span id="count">0</span> 次</p>
    <button id="btn">点我一下</button>
  </div>
  <script>
    const timeEl = document.getElementById('time');
    const tick = () => timeEl.textContent = new Date().toLocaleString('zh-CN');
    tick();
    setInterval(tick, 1000);

    let count = 0;
    const countEl = document.getElementById('count');
    document.getElementById('btn').addEventListener('click', () => {
      countEl.textContent = ++count;
    });
  </script>
</body>
</html>
